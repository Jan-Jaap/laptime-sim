[project]
name = "laptime_sim"
version = "1.0.0"
description = ""
readme = "README.md"
authors = [
    { name = "JanJaapvandeVelde", email = "janjaap.vandevelde@gmail.com" },
]
requires-python = "<4.0,>=3.14"
dependencies = [
    "streamlit-folium>=0.24.0",
    "streamlit>=1.44.1",
    "geopandas>=1.0.1",
    "mapclassify>=2.11.0",
    "matplotlib>=3.10.1",
    "numba>=0.61.0",
    "tqdm>=4.67.1",
    "scipy>=1.15.2",
]

[project.scripts]
laptime-sim = "laptime_sim.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/temp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
